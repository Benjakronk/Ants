<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a0806;
    overflow: hidden;
    cursor: none;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    /* faint ambient glow behind the "monitor" */
    background:
      radial-gradient(ellipse at 50% 50%, #16100a 0%, #0a0806 60%, #050403 100%);
  }
  #stage {
    position: relative;
    /* sized by JS to integer scale of 320x200 */
  }
  #game {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    width: 100%; height: 100%;
    background: #000;
  }
  /* CRT overlay: scanlines + vignette + subtle RGB mask, pure CSS, toggleable */
  #crt {
    position: absolute; inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.35) 100%),
      repeating-linear-gradient(to bottom,
        rgba(0,0,0,0)    0px,
        rgba(0,0,0,0)    2px,
        rgba(0,0,0,0.22) 3px),
      repeating-linear-gradient(to right,
        rgba(255,0,0,0.03) 0px, rgba(0,255,0,0.02) 1px, rgba(0,0,255,0.03) 2px, rgba(0,0,0,0) 3px);
  }
  #crt.off { display: none; }
  /* phosphor flicker */
  #crt::after {
    content: "";
    position: absolute; inset: 0;
    background: rgba(180, 200, 255, 0.012);
    animation: flick 0.09s steps(2) infinite;
  }
  @keyframes flick { 50% { opacity: 0.4; } }
</style>

<div id="stage">
  <canvas id="game" width="320" height="200"></canvas>
  <div id="crt"></div>
</div>
