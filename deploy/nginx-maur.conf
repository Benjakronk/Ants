# nginx server block for maur.lektorensrud.no -- static files from
# /srv/maur/public, the API and the WebSocket on 127.0.0.1:3006 (one Node
# process). Filled in from VPS-deploy/templates/nginx-websocket.conf.
#
#   sudo cp nginx-maur.conf /etc/nginx/sites-available/maur.lektorensrud.no
#   sudo ln -s /etc/nginx/sites-available/maur.lektorensrud.no /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d maur.lektorensrud.no      (only once DNS resolves)
#
# certbot rewrites this file in place: FIRST install only, never re-copy it.
#
# Zone first, in /etc/nginx/conf.d/ratelimit.conf (its own zone):
#   limit_req_zone $binary_remote_addr zone=maur:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name maur.lektorensrud.no;

    root /srv/maur/public;
    index index.html;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript
               application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    location = /ws {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header Origin            $http_origin;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    location /api/ {
        limit_req zone=maur burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html { add_header Cache-Control "no-cache"; }
    location /js/ { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri.html $uri/ =404; }
}
